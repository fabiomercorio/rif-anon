# RIF v0.2 — third-party encoding of Joulin et al., EACL 2017 (fastText)
# Part of the anonymous EACL 2027 artifact.
#
# datasets.yaml — datasets as first-class nodes ("resolve, don't host").
# Each node resolves to an existing repository (Hugging Face, DataCite/Zenodo,
# OpenML, or a stable URI) and carries version, checksum, license and access:
# the stable identity that re-execution needs to promote as-reported -> verified.
# checksum: TODO entries are honest gaps of this third-party encoding - the
# original paper predates dataset registries; an author encoding (or the CI)
# fills them at first verification.

datasets:
