# RIF v0.2 — third-party encoding of Joulin et al., EACL 2017 (fastText)
# Part of the anonymous EACL 2027 artifact.
#
# references.yaml — related work as typed, resolvable nodes ("resolve, don't host").
# Resolution levels, best to fallback:
#   rif:      claim-level anchor into another RIF repository (full interoperability)
#   doi/arxiv/openalex: document-level identifier, resolved via Crossref/DataCite/OpenAlex
#   bibtex:   inline entry, last resort for grey literature
# The bibliography of any rendered view is a DERIVED artifact: the renderer
# generates it from the reference nodes actually anchored in that view,
# in the citation style of the target venue.

references:
  - id: R1
    resolve: { arxiv: "1509.01626" }
    label: "Zhang, Zhao & LeCun (2015), Character-level Convolutional Networks for Text Classification, NeurIPS"
    role: baseline          # baseline | method-source | dataset-source | positioning
    anchored_by: [C1, C4, E1]

  - id: R2
    resolve: { arxiv: "1606.01781" }
    label: "Conneau et al. (2017), Very Deep Convolutional Networks for Text Classification (VDCNN), EACL"
    role: baseline
    anchored_by: [C4, E1]

  - id: R3
    resolve: { doi: "10.3115/v1/D14-1194" }
    label: "Weston, Chopra & Adams (2014), #TagSpace: Semantic Embeddings from Hashtags, EMNLP"
    role: baseline
    anchored_by: [C6, E3]

  - id: R4
    resolve: { arxiv: "1301.3781" }
    label: "Mikolov et al. (2013), Efficient Estimation of Word Representations in Vector Space (CBOW)"
    role: method-source     # the model shares its core with CBOW
    anchored_by: [C2]

  - id: R5
    resolve: { bibtex: "@inproceedings{joachims1998, author={Joachims, Thorsten}, title={Text Categorization with Support Vector Machines}, booktitle={ECML}, year={1998}}" }
    label: "Joachims (1998), ECML"
    role: positioning       # linear classifiers as historically strong baselines
    anchored_by: [C1, E4]

  - id: R6
    resolve: { bibtex: "@inproceedings{mccallum1998, author={McCallum, Andrew and Nigam, Kamal}, title={A Comparison of Event Models for Naive Bayes Text Classification}, booktitle={AAAI Workshop on Learning for Text Categorization}, year={1998}}" }
    label: "McCallum & Nigam (1998)"
    role: positioning
    anchored_by: [C1, E4]

