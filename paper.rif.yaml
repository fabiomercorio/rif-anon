# RIF v0.2 encoding of:
# Joulin, Grave, Bojanowski, Mikolov,
# "Bag of Tricks for Efficient Text Classification", EACL 2017.
# THIRD-PARTY ENCODING: produced from the published text, not by the authors.
# All results carry provenance "as-reported" (from the paper's tables);
# insights are marked "derived" (inferred from the published text, NOT authorial voice).

rif_version: "0.2"

encoding:
  by: third-party          # author | third-party
  source: "arXiv:1607.01759 / EACL 2017"
  note: >
    Insights below are derived from the published text and do not constitute
    the authors' non-generable voice. An author-produced encoding would
    replace them.

work:
  id: rif://joulin-2017-fasttext
  title: "Bag of Tricks for Efficient Text Classification"
  authors:
    - { name: Armand Joulin }
    - { name: Edouard Grave }
    - { name: Piotr Bojanowski }
    - { name: Tomas Mikolov }
  published_as:
    - { venue: "EACL 2017 (short papers)", year: 2017 }
    - { venue: "arXiv:1607.01759", year: 2016 }
  artifacts:
    - { kind: code, uri: "https://github.com/facebookresearch/fastText" }

claims:
  - id: C1
    type: positioning
    statement: >
      At the time of writing, linear/shallow baselines for text classification
      were under-explored against increasingly complex deep models, despite
      their known strength when properly tuned.
    audience_floor: layperson
    evidence: [E4]

  - id: C2
    type: methodological
    statement: >
      A linear classifier over averaged bag-of-n-gram embeddings (a shallow
      architecture sharing its core with CBOW) is a viable text classifier.
    audience_floor: student
    depends_on: [C1]
    evidence: [F1]

  - id: C3
    type: formal
    statement: >
      Hierarchical softmax over the labels reduces classification complexity
      from O(kh) to O(h log k); the hashing trick bounds the memory of the
      n-gram feature space.
    audience_floor: expert
    depends_on: [C2]
    evidence: [F1]

  - id: C4
    type: empirical
    statement: >
      With bigram features, fastText is on par with deep learning classifiers
      on standard sentiment/topic benchmarks (e.g., AG 92.5, Sogou 96.8,
      DBpedia 98.6, Yelp P. 95.7), while remaining behind the deepest CNNs
      on fine-grained large datasets (e.g., Amazon F. 60.2 vs 63.0 of VDCNN).
    audience_floor: student
    depends_on: [C2]
    evidence: [E1]
    non_claims:
      - "No claim of state-of-the-art accuracy across the board: VDCNN retains an edge on several large fine-grained datasets."

  - id: C5
    type: empirical
    statement: >
      fastText is many orders of magnitude faster than deep classifiers:
      it trains on more than one billion words in less than ten minutes on a
      standard multicore CPU, and classifies half a million sentences among
      312K classes in less than a minute.
    audience_floor: layperson
    depends_on: [C2, C3]
    evidence: [E2]

  - id: C6
    type: empirical
    statement: >
      On YFCC100M tag prediction, fastText (h=200, bigrams) reaches 46.1
      prec@1 against 35.6 of Tagspace (h=200), training in 13m38s.
    audience_floor: practitioner
    depends_on: [C2]
    evidence: [E3]

  - id: C7
    type: methodological
    statement: >
      The approach is released as an open-source library (fastText),
      reusable for classification and representation learning.
    audience_floor: layperson
    depends_on: [C2]
    evidence: [E5]

evidence:
  - id: F1
    kind: proof
    protocol: >
      Architecture: n-gram features embedded, averaged into a text
      representation, fed to a linear classifier; softmax over labels replaced
      by hierarchical softmax based on Huffman coding; n-gram memory bounded
      via the hashing trick.
    results:
      - { metric: complexity, value: "O(h log k) vs O(kh)", provenance: as-reported }

  - id: E1
    kind: experiment
    protocol: "Sentiment/topic classification on 8 standard datasets, comparison against char-CNN, VDCNN and other deep baselines (Table 1 of the paper)."
    datasets:
      - { name: "AG, Sogou, DBpedia, Yelp P., Yelp F., Yahoo A., Amazon F., Amazon P.", uri: "as distributed by Zhang et al. 2015" }
    command: "./fasttext supervised -input train.txt -output model -wordNgrams 2"
    results:
      - { metric: "accuracy (bigram)", value: "AG 92.5 / Sogou 96.8 / DBpedia 98.6 / Yelp P. 95.7 / Yelp F. 63.9 / Yahoo A. 72.3 / Amazon F. 60.2 / Amazon P. 94.6", provenance: as-reported }
      - { metric: "best deep baseline (VDCNN)", value: "AG 91.3 / Sogou 96.8 / DBpedia 98.7 / Yelp P. 95.7 / Yelp F. 64.7 / Yahoo A. 73.4 / Amazon F. 63.0 / Amazon P. 95.7", provenance: as-reported }

  - id: E2
    kind: experiment
    protocol: "Training/inference speed measurements on standard multicore CPU vs deep baselines trained on GPU (Table 2 of the paper; abstract)."
    results:
      - { metric: "training throughput", value: "> 1B words in < 10 minutes, multicore CPU", provenance: as-reported }
      - { metric: "inference", value: "500K sentences, 312K classes, < 1 minute", provenance: as-reported }
      - { metric: "per-epoch time vs char-CNN/VDCNN", value: "seconds vs hours (exact per-dataset values in Table 2)", provenance: as-reported }

  - id: E3
    kind: experiment
    protocol: "Tag prediction on YFCC100M captions/titles; comparison with Tagspace (Table 5 of the paper)."
    results:
      - { metric: "prec@1", value: 46.1, provenance: as-reported }
      - { metric: "prec@1 (Tagspace h=200)", value: 35.6, provenance: as-reported }
      - { metric: "training time", value: "13m38s", provenance: as-reported }

  - id: E4
    kind: external
    protocol: "Literature at publication time: deep architectures dominant in text classification evaluations; linear baselines (McCallum & Nigam; Joachims) known strong but rarely tuned/reported."
    results:
      - { metric: gap-esistente, value: true, provenance: as-reported }

  - id: E5
    kind: external
    protocol: "Public release of the fastText library."
    results:
      - { metric: availability, value: "github.com/facebookresearch/fastText", provenance: verified }

insights:   # THIRD-PARTY: derived from the published text (see encoding.note)
  contributions:
    - { id: K1, statement: "A tuned linear baseline that matches deep classifiers on standard benchmarks at a fraction of the cost.", claims: [C4, C5], provenance: derived }
    - { id: K2, statement: "Scalability mechanisms (hierarchical softmax + hashing) that make text classification practical at hundreds of thousands of classes.", claims: [C3, C6], provenance: derived }
    - { id: K3, statement: "An open-source library that turned the baseline into common practice.", claims: [C7], provenance: derived }
  reading:
    - { id: R1, about: [E1], text: "The comparison the paper insists on is not accuracy alone but the accuracy/cost ratio: near-parity at orders-of-magnitude lower cost.", provenance: derived }
  watchpoints:
    - { id: W1, about: [C4], severity: limitation, text: "The gap vs the deepest CNNs grows on large fine-grained datasets (Yelp F., Amazon F.): parity is not universal.", provenance: derived }
    - { id: W2, about: [C2], severity: caution, text: "Competitive accuracy requires bigram features; the unigram model alone is substantially weaker.", provenance: derived }
    - { id: W3, about: [C3], severity: open-problem, text: "Hashing collisions on n-gram features are unquantified in the paper.", provenance: derived }
  outlook: "Baselines of this kind should be systematically reported before adopting deeper architectures."

style:
  corpus:   # the authors' own prior work, for stylistic emulation
    - { title: "Efficient Estimation of Word Representations in Vector Space (word2vec)", weight: 1.0 }
    - { title: "Enriching Word Vectors with Subword Information (TACL 2017)", weight: 0.8 }
  register:
    person: we
    stance: "Minimal, direct; results carry the argument; no rhetorical claims."
  lexicon:
    prefer: ["baseline", "efficient", "on par with", "speed-up"]
    avoid: ["novel paradigm", "breakthrough"]

figures:
  - id: G1
    kind: original
    uri: "figures/fig1-model-architecture.pdf   # Figure 1 of the paper"
    anchors: [C2]
    audience: [student, practitioner, expert]
    captions:
      expert: "Model architecture: n-gram features embedded, averaged, and fed to a linear classifier with hierarchical softmax."
      practitioner: "What the library builds internally: averaged n-gram embeddings + linear head."
      student: "The whole model: word (and word-pair) vectors averaged into one text vector, then a linear classifier."
    alt: "Diagram of the fastText architecture."
    license: "© the authors; verbatim reuse in views subject to permission"
  - id: G2
    kind: generable
    from: E1
    anchors: [C4]
    audience: [expert, practitioner]

profiles:
  - { name: reviewer,     expertise: expert,       goal: evaluate, time_budget: 10min, language: en, formalism: full }
  - { name: practitioner, expertise: practitioner, goal: apply,    time_budget: 5min,  language: en, formalism: light }
  - { name: student,      expertise: student,      goal: learn,    time_budget: 10min, language: en, formalism: none }
